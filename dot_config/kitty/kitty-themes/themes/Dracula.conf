# Rich Black: opaque surfaces, neutral UI chrome, restrained semantic ANSI colors.
background #070707
foreground #f5f5f5
background_opacity 1.0

cursor #f5f5f5
cursor_text_color #070707
selection_background #1d1d1d
selection_foreground #f5f5f5
url_color #f5f5f5

# ANSI 0-15. The hues are deliberately muted so terminal semantics remain legible
# without turning the desktop palette into a colored theme.
color0  #070707
color8  #6f6f6f
color1  #c96b6b
color9  #e08a8a
color2  #8fb38f
color10 #b1d1b1
color3  #c7b67a
color11 #dfcf96
color4  #8da9c4
color12 #abc4dc
color5  #b59abf
color13 #ceb4d8
color6  #87b6b6
color14 #a9d2d2
color7  #a1a1a1
color15 #f5f5f5

active_tab_foreground #070707
active_tab_background #f5f5f5
inactive_tab_foreground #a1a1a1
inactive_tab_background #111111
tab_bar_background #0c0c0c
active_border_color #1d1d1d
inactive_border_color #1d1d1d
bell_border_color #f5f5f5
