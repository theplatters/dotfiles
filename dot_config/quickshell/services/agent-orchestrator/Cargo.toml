[package]
name = "qs-agent-orchestrator"
version = "0.1.0"
edition = "2021"
default-run = "qs-agent-orchestrator"

[lib]
name = "qs_agent_orchestrator"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
